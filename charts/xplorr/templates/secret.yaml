{{- include "xplorr.validate" . -}}
{{- if not .Values.xplorr.existingSecret }}
{{/*
The ingest token. It can write cost data for one cluster and can do nothing
else: it carries no read access, and revoking it in the Xplorr console takes
effect on the next run.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xplorr.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xplorr.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.xplorr.ingestToken | quote }}
{{- end }}
