{{- include "xplorr.validate" . -}}
{{/*
The collector.

It curls the in-cluster OpenCost API and posts the response to Xplorr
unchanged, so Xplorr runs one parser over push and pull alike. Nothing is
exposed: no inbound access, no public endpoint, no cloud credentials, and no
ServiceAccount token mounted.

With prometheus.url set, it also runs a fixed set of instant PromQL queries
per day and posts the raw Prometheus responses, gzipped, to the usage ingest
path. The image has no jq, so nothing is parsed here: the payload is the
responses joined into one JSON object by printf and cat, and Xplorr parses
it. The query text below must match PROMQL in the Xplorr cloud-sync service
(providers/kubernetes/prometheus.js); RANGE is replaced with the day's
length in seconds.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "xplorr.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xplorr.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.xplorr.schedule | quote }}
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "xplorr.labels" . | nindent 12 }}
          {{- with .Values.xplorr.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.xplorr.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.xplorr.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.xplorr.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: collector
              image: "{{ .Values.xplorr.image.repository }}:{{ .Values.xplorr.image.tag }}"
              imagePullPolicy: {{ .Values.xplorr.image.pullPolicy }}
              env:
                - name: OPENCOST_URL
                  value: {{ include "xplorr.openCostUrl" . | quote }}
                - name: XPLORR_INGEST_URL
                  value: {{ include "xplorr.ingestUrl" . | quote }}
                - name: COST_WINDOW
                  value: {{ .Values.xplorr.window | quote }}
                {{- if .Values.prometheus.url }}
                - name: PROMETHEUS_URL
                  value: {{ trimSuffix "/" .Values.prometheus.url | quote }}
                - name: PROMETHEUS_DCGM
                  value: {{ ternary "true" "false" (.Values.prometheus.dcgm | default false) | quote }}
                {{- end }}
                - name: XPLORR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "xplorr.secretName" . }}
                      key: token
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Wait for OpenCost to answer before asking it for anything.
                  #
                  # A Service with no ready endpoints refuses the connection
                  # rather than hanging, so the first run after an install
                  # would otherwise fail outright while OpenCost was still
                  # starting. That looked like a wrong address and is not one.
                  i=0
                  until curl -sS --max-time 10 -o /dev/null "$OPENCOST_URL/healthz"; do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "OpenCost at $OPENCOST_URL did not answer within five minutes."
                      echo "Check it is running: kubectl get pods -l app.kubernetes.io/name=opencost"
                      exit 1
                    fi
                    echo "waiting for OpenCost at $OPENCOST_URL ($i)"
                    sleep 10
                  done
                  echo "OpenCost is answering"
                  # Ask OpenCost for daily allocations over the window, idle kept separate.
                  curl -sS --fail-with-body --max-time 120 --retry 5 --retry-delay 5 --retry-connrefused \
                    --get "$OPENCOST_URL/allocation" \
                    --data-urlencode "window=$COST_WINDOW" \
                    --data-urlencode "aggregate=namespace,controllerKind,controller,pod" \
                    --data-urlencode "step=1d" \
                    --data-urlencode "accumulate=false" \
                    --data-urlencode "includeIdle=true" \
                    --data-urlencode "shareIdle=false" \
                    -o /tmp/allocations.json
                  echo "collected $(wc -c < /tmp/allocations.json) bytes from OpenCost"
                  # Send it on unchanged. The token never reaches stdout.
                  curl -sS --fail-with-body --max-time 120 --retry 5 --retry-delay 5 --retry-connrefused \
                    -X POST "$XPLORR_INGEST_URL" \
                    -H "Authorization: Bearer $XPLORR_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data-binary @/tmp/allocations.json
                  echo ""
                  echo "sent allocations to Xplorr"
                  # Node assets, one day per request since the Assets API has no step.
                  days="${COST_WINDOW%d}"
                  now=$(date -u +%s)
                  i=0
                  while [ "$i" -lt "$days" ]; do
                    start=$((now - now % 86400 - i * 86400))
                    day=$(date -u -d "@$start" +%Y-%m-%d)
                    if [ "$i" -eq 0 ]; then
                      stop_at=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)
                    else
                      stop_at=$(date -u -d "@$((start + 86400))" +%Y-%m-%dT00:00:00Z)
                    fi
                    if curl -sS --fail-with-body --max-time 120 --retry 5 --retry-delay 5 --retry-connrefused \
                         --get "$OPENCOST_URL/assets" \
                         --data-urlencode "window=${day}T00:00:00Z,${stop_at}" \
                         -o /tmp/assets.json; then
                      curl -sS --fail-with-body --max-time 120 --retry 5 --retry-delay 5 --retry-connrefused \
                        -X POST "$XPLORR_INGEST_URL/assets?date=$day" \
                        -H "Authorization: Bearer $XPLORR_TOKEN" \
                        -H "Content-Type: application/json" \
                        --data-binary @/tmp/assets.json || echo "node assets for $day were not accepted"
                      echo ""
                    else
                      echo "OpenCost assets unavailable for $day, skipped"
                    fi
                    i=$((i + 1))
                  done
                  {{- if .Values.prometheus.url }}
                  # Usage percentiles from Prometheus, one payload per day.
                  # Best effort: a Prometheus that is down or missing a metric
                  # never stops cost collection, and a failed query is sent as
                  # null so Xplorr treats it as missing rather than zero.
                  q() {
                    expr=$(printf '%s' "$2" | sed "s/RANGE/${range}s/g")
                    if curl -sS --fail --max-time 120 --retry 3 --retry-delay 5 --retry-connrefused                          --get "$PROMETHEUS_URL/api/v1/query"                          --data-urlencode "query=$expr"                          --data-urlencode "time=$eval_at"                          -o /tmp/q.json && [ "$(head -c 1 /tmp/q.json)" = "{" ]; then
                      :
                    else
                      echo "Prometheus query $1 failed for $day"
                      echo null > /tmp/q.json
                    fi
                    printf '%s"%s":' "$sep" "$1" >> /tmp/usage.json
                    cat /tmp/q.json >> /tmp/usage.json
                    sep=","
                  }
                  CPU='sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m]))'
                  MEM='sum by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})'
                  DCGM_BY='namespace, pod, container, exported_namespace, exported_pod, exported_container'
                  i=0
                  while [ "$i" -lt "$days" ]; do
                    start=$((now - now % 86400 - i * 86400))
                    day=$(date -u -d "@$start" +%Y-%m-%d)
                    eval_at=$((start + 86400))
                    if [ "$eval_at" -gt "$now" ]; then eval_at=$now; fi
                    range=$((eval_at - start))
                    if [ "$range" -lt 3600 ]; then
                      echo "usage for $day skipped, less than an hour of it so far"
                      i=$((i + 1))
                      continue
                    fi
                    printf '{"version":1,"date":"%s","results":{' "$day" > /tmp/usage.json
                    sep=""
                    q cpu_p50 "quantile_over_time(0.5, ($CPU)[RANGE:5m])"
                    q cpu_p95 "quantile_over_time(0.95, ($CPU)[RANGE:5m])"
                    q cpu_max "max_over_time(($CPU)[RANGE:5m])"
                    q cpu_samples "count_over_time(($CPU)[RANGE:5m])"
                    q mem_p50 "quantile_over_time(0.5, ($MEM)[RANGE:5m])"
                    q mem_p95 "quantile_over_time(0.95, ($MEM)[RANGE:5m])"
                    q mem_max "max_over_time(($MEM)[RANGE:5m])"
                    q cpu_request 'max by (namespace, pod, container) (max_over_time(kube_pod_container_resource_requests{resource="cpu"}[RANGE]))'
                    q cpu_limit 'max by (namespace, pod, container) (max_over_time(kube_pod_container_resource_limits{resource="cpu"}[RANGE]))'
                    q mem_request 'max by (namespace, pod, container) (max_over_time(kube_pod_container_resource_requests{resource="memory"}[RANGE]))'
                    q mem_limit 'max by (namespace, pod, container) (max_over_time(kube_pod_container_resource_limits{resource="memory"}[RANGE]))'
                    q gpu_request 'max by (namespace, pod, container) (max_over_time(kube_pod_container_resource_requests{resource="nvidia_com_gpu"}[RANGE]))'
                    q pod_owner 'max by (namespace, pod, owner_kind, owner_name) (max_over_time(kube_pod_owner[RANGE]))'
                    q replicaset_owner 'max by (namespace, replicaset, owner_kind, owner_name) (max_over_time(kube_replicaset_owner[RANGE]))'
                    if [ "$PROMETHEUS_DCGM" = "true" ]; then
                      q gpu_util_avg "avg by ($DCGM_BY) (avg_over_time(DCGM_FI_DEV_GPU_UTIL[RANGE]))"
                      q gpu_util_p95 "max by ($DCGM_BY) (quantile_over_time(0.95, DCGM_FI_DEV_GPU_UTIL[RANGE]))"
                      q gpu_mem_used_p95 "sum by ($DCGM_BY) (quantile_over_time(0.95, DCGM_FI_DEV_FB_USED[RANGE]))"
                    fi
                    printf '}}' >> /tmp/usage.json
                    gzip -c /tmp/usage.json > /tmp/usage.json.gz
                    echo "collected $(wc -c < /tmp/usage.json) bytes of usage for $day from Prometheus"
                    curl -sS --fail-with-body --max-time 120 --retry 5 --retry-delay 5 --retry-connrefused \
                      -X POST "$XPLORR_INGEST_URL/usage" \
                      -H "Authorization: Bearer $XPLORR_TOKEN" \
                      -H "Content-Type: application/json" \
                      -H "Content-Encoding: gzip" \
                      --data-binary @/tmp/usage.json.gz || echo "usage for $day was not accepted"
                    echo ""
                    i=$((i + 1))
                  done
                  rm -f /tmp/usage.json /tmp/usage.json.gz /tmp/q.json
                  {{- end }}
                  echo "sent to Xplorr"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                privileged: false
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.xplorr.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
